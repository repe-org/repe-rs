[package]
name = "repe-minimal-consumer"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone rather than a member of the repe workspace, for the same reason
# `wasm-tests/*` is: this is CI scaffolding, not part of the crate, and keeping
# it out means `cargo test` at the root never builds it.
#
# Standalone is also the *point* here rather than a convenience. What this crate
# asserts is the contents of its own `[dependencies]` table, and a workspace
# member inherits enough of its parent's graph that the assertion would be
# meaningless.
[workspace]

# The whole fixture. `repe-core` and `structio` — nothing else.
#
# `structio` is a fair ask: the source below writes `structio::object!`. What
# this pins is that the *generated* code names nothing beyond it. The derive
# emits calls to `repe_core`'s own surface — `ResponseBody::write`,
# `RequestBody::read` — and never a codec path of its own, so a consumer's
# manifest holds only what its source actually writes.
#
# That guarantee used to need machinery. The derive emitted absolute
# `::serde_json::...` paths at 22 sites, then `repe::__private::serde_json` to
# stop requiring a dependency nothing in the source mentioned. Neither is here
# any more: the encoding is entirely in the user's own `object!` declaration,
# so there is no codec for the generated code to name.
#
# Every crate in the repe workspace has `structio` in scope, so a regression
# that reintroduced a hardcoded path would compile everywhere except in a real
# consumer. That is what this standalone crate is for.
#
# `repe-core` has no features left to ask for: `typed` gated `beve` and its six
# transitive packages, and structio has no dependencies to gate.
[dependencies]
repe-core = { path = "../../repe-core" }
structio = "0.3.0"

[package]
name = "repe-wasm-test-client"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone rather than a member of the repe workspace, and outside `tests/`
# on purpose. `wasm-pack test` always passes `--tests`, so from the root it
# would build all two dozen host-only integration tests for wasm32 and fail on
# the first `#[cfg(not(target_arch = "wasm32"))]` item they import. Here it sees
# only the browser suite.
[workspace]

[dependencies]
repe = { path = "../..", features = ["websocket-wasm"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The wire types the browser suite sends and expects back. `repe` re-exports
# nothing that would let a test declare one, so the declaration macro comes from
# structio directly.
structio = "0.2.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# `setTimeout` as a future, so a test that would otherwise hang fails with a
# message naming what it was waiting for. See `within_timeout` in tests/browser.rs.
gloo-timers = { version = "0.3", features = ["futures"] }

[package]
name = "repe-core"
version = "3.0.0"
edition = "2024"
rust-version = "1.96.1"
description = "Core types for serving a Rust struct over the REPE RPC protocol, without the server, client, or transport"
license = "MIT"
repository = "https://github.com/repe-org/repe-rs"
documentation = "https://docs.rs/repe-core"
readme = "README.md"
keywords = ["rpc", "protocol", "repe", "json"]
categories = ["network-programming", "encoding"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/src/**", "/tests/**"]

[package.metadata.docs.rs]
# Not for intra-doc links — `write_typed_slice` is present at both feature
# settings, so the default build documents cleanly. It is so docs.rs shows the
# *real* method, with its BEVE bound and its encoding, rather than the
# uncallable stand-in the default build carries.
all-features = true

[features]
# Deliberately empty. The point of this crate is a light dependency list, and
# the BEVE encoder is the only heavy thing in it — see `typed` below.
default = []
# `ResponseBody::write_typed_slice`, the BEVE typed-numeric array encoding a
# `#[repe(typed)]` field is read as.
#
# Off by default because it is the whole cost of this crate. Everything else
# here is `serde`, `serde_json` and `thiserror`, which a crate declaring a
# served type already has or does not mind; `beve` adds itself plus `bytemuck`,
# `half`, `cfg-if`, `simdutf8`, `zerocopy` and `zerocopy-derive` — seven
# packages on a fresh resolve, six of which link into the artifact rather than
# running at build time. (This repo's lockfile pins `half` 2.6, which predates
# its `zerocopy` dependency and shows only five; a new consumer resolves 2.7 and
# gets all seven. Measure the delta, not this workspace's lock.) A crate
# that declares a type and derives paths on it — the crate this one was split
# out for — usually has no `#[repe(typed)]` field at all, and should not link a
# numeric-array encoder to say so.
#
# `repe` enables it unconditionally: it depends on `beve` directly for the
# builder-side half of the same encoding, so through `repe` this is free and
# always on. Only a crate depending on `repe-core` *directly* pays or saves.
#
# The gated surface is one inherent method, so a struct with no `#[repe(typed)]`
# field compiles identically either way. A struct that has one names the feature
# in its error message rather than failing to resolve the method — the method
# stays declared with the feature off, bound by a trait nothing implements. That
# trait, `structs::TypedSliceElement`, exists only in that configuration; with
# the feature on there is no extra public API at all.
typed = ["dep:beve"]

[dependencies]
# The typed-numeric body encoding `ResponseBody::write_typed_slice` produces,
# behind the `typed` feature. Pinned to the major `repe` pins, since the two
# share one `ResponseBody`.
beve = { version = "10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Re-exported, so a crate implementing `RepeStruct` needs one dependency rather
# than two. The derive resolves its generated paths against whichever of `repe`
# and `repe-core` it finds, so the same macro serves both.
repe-derive = { path = "../repe-derive", version = "0.6.0" }

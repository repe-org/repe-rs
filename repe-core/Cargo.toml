[package]
name = "repe-core"
version = "4.0.0"
edition = "2024"
rust-version = "1.96.1"
description = "Core types for serving a Rust struct over the REPE RPC protocol, without the server, client, or transport"
license = "MIT"
repository = "https://github.com/repe-org/repe-rs"
documentation = "https://docs.rs/repe-core"
readme = "README.md"
keywords = ["rpc", "protocol", "repe", "json"]
categories = ["network-programming", "encoding"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/src/**", "/tests/**"]

[dependencies]
# JSON and BEVE from one struct declaration, with no dependencies of its own and
# no intermediate `Value`. It replaces `serde`, `serde_json` and `beve` in one
# move: a served field is read straight into the live member and written straight
# into the outgoing frame, which is what `ResponseBody` was already shaped for
# and what the request side now matches.
#
# There is no `typed` feature any more. It existed because the BEVE typed-array
# encoder arrived with `beve` and six transitive packages behind it, and a crate
# that only *declares* a served type should not link an encoder to say so.
# structio has no dependencies at all, so the encoder costs nothing to carry and
# `ResponseBody::write_typed_slice` is unconditional.
structio = "0.3.1"
thiserror = "1"
# Re-exported, so a crate implementing `RepeStruct` needs one dependency rather
# than two. The derive resolves its generated paths against whichever of `repe`
# and `repe-core` it finds, so the same macro serves both.
repe-derive = { path = "../repe-derive", version = "0.7.0" }

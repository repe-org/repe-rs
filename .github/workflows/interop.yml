name: Interop (C++ / Glaze)

# Pins REPE wire compatibility with the canonical C++ implementation (Glaze).
# Kept separate from the main Rust CI so that workflow stays toolchain-light;
# this one needs CMake and a C++23 compiler to build the fixture generator.
#
# Two halves, both pinned to one Glaze tag:
#
#   * Wire format — rebuilds the fixture generator, regenerates the committed
#     fixtures, and fails if anything drifted (a Glaze change or a repe-rs change
#     that breaks parity), then runs the Rust interop tests against them.
#   * Plugin ABI, both directions — a C++ Glaze host drives this crate's plugin
#     example, and this crate's host drives a C++ Glaze plugin. This is the half
#     no Rust-only test can cover: it fails if the exported symbols, the metadata
#     layout, or the response-buffer contract diverge from
#     `glaze/rpc/repe/plugin.h`. Running it in one direction only would leave one
#     implementation agreeing with itself, which it does by construction even
#     when both ends misread the same clause.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  GLAZE_TAG: v8.0.0

jobs:
  interop:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install C++23 toolchain and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build

      - name: Build C++ interop tools (fetches Glaze ${{ env.GLAZE_TAG }})
        run: |
          cmake -S interop/cpp -B interop/cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DGLAZE_GIT_TAG=${{ env.GLAZE_TAG }}
          cmake --build interop/cpp/build

      - name: Regenerate fixtures
        run: ./interop/cpp/build/generate_fixtures interop/fixtures ${{ env.GLAZE_TAG }}

      - name: Assert committed fixtures still match Glaze output
        run: git diff --exit-code -- interop/fixtures

      - name: Run interop tests
        run: cargo test --test interop

      # The plugin half. `crate-type = ["cdylib"]` on the example produces a real
      # shared library, so what the host loads is what a deployment would load.
      - name: Build the Rust plugin as a cdylib
        run: cargo build --release --features plugin --example repe_plugin

      - name: Drive the Rust plugin from a C++ Glaze host
        run: ./interop/cpp/build/plugin_host target/release/examples/librepe_plugin.so

      # The mirror. `libexample_plugin.so` is a C++ Glaze plugin, built by the
      # CMake step above alongside the host.
      - name: Build the Rust host
        run: cargo build --release --features plugin-host --example plugin_host

      - name: Drive a C++ Glaze plugin from the Rust host
        run: ./target/release/examples/plugin_host interop/cpp/build/libexample_plugin.so

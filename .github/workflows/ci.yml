name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      # `--all-features` turns `repe-core`'s `typed` on, and feature unification
      # would turn it on regardless because `repe` enables it. So the one
      # configuration that crate exists to serve — `repe-core` alone, default
      # features, no BEVE encoder linked — is compiled by nothing else in this
      # file, and would break silently.
      - name: Clippy (repe-core, no `typed`)
        run: cargo clippy -p repe-core --all-targets -- -D warnings

      - name: Tests (repe-core, no `typed`)
        run: cargo test -p repe-core

      # The point of the feature, asserted directly rather than inferred from
      # the above compiling: `beve` and the six packages behind it stay out of a
      # default `repe-core` graph. Deliberately no package *count* here — that
      # depends on the lockfile and on when the graph was resolved, and it has
      # already been wrong once. The assertion greps for `beve` itself, which
      # cannot rot the same way.
      - name: repe-core's default graph carries no BEVE encoder
        run: |
          tree=$(cargo tree -p repe-core --edges normal --prefix none)
          if grep -q '^beve ' <<<"$tree"; then
            echo "::error::beve reached repe-core's default feature set" >&2
            printf '%s\n' "$tree" >&2
            exit 1
          fi

      # `#[derive(RepeStruct)]` resolves `serde_json` through
      # `repe_core::__private`, so a deriving crate declares only what its own
      # source names. Nothing else here can check that: every crate in this
      # workspace has `serde_json` in scope already, so a regression to an
      # absolute `::serde_json` path compiles green everywhere and fails only in
      # a real consumer. The fixture is a standalone crate whose entire point is
      # its `[dependencies]` table.
      - name: A consumer crate needs no `serde_json` of its own
        run: cargo build --manifest-path derive-tests/minimal-consumer/Cargo.toml

      - name: Docs
        run: cargo doc --workspace --no-deps

  # `wasm_client` is gated on `all(feature = "websocket-wasm", target_arch =
  # "wasm32")`, so the `check` job above never compiles it: `--all-features` on
  # ubuntu leaves the cfg false. Without this job the module is unbuilt, which
  # is how it spent 6.0.0 through 7.0.1 failing to compile against a
  # `RepeError` variant added in 6.0.0.
  #
  # Every non-portable module is `not(wasm32)` in lib.rs and every non-portable
  # dependency is target-gated to match, so any feature set is buildable here.
  # The `--lib` on the all-features step is what excludes the `cli` binary,
  # which is a native CLI (tokio runtime, sockets) and is not meant to target
  # wasm32 at any feature set.
  wasm:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy (websocket-wasm)
        run: cargo clippy --features websocket-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Clippy (core, no features)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      # Guards the target-gating of `zstandard` and `uniudp`. Enabling
      # `value-stream` or `fleet-udp` on wasm32 used to fail in a *build script*
      # — zstd-sys compiling `huf_decompress_amd64.S`, mio rejecting the target —
      # which no job here reached, so a workspace could not hoist either feature
      # into a feature set shared with a browser client. `value-stream` now
      # compresses with the pure-Rust `zstandard`, which has no build script at
      # all; the gate stays so the dep tracks the `not(wasm32)` module it serves.
      # `--lib` skips the `cli` bin; everything else stays covered as new
      # features are added.
      - name: Clippy (all features, lib only)
        run: cargo clippy --all-features --lib --target wasm32-unknown-unknown -- -D warnings

  # The job above proves `wasm_client` compiles. This one proves it works.
  #
  # Nothing in the host suite executes a line of that module, so its failure
  # mode after 7.0.2 stopped being "does not build" and became "builds and
  # silently does nothing" -- which is exactly how server-pushed notifies were
  # unreachable from the browser. These tests drive a real `WebSocket` in a real
  # browser against a scripted server; see `wasm-tests/README.md`.
  #
  # Separate from the `wasm` job so a chromedriver flake cannot mask a genuine
  # compile regression, and vice versa.
  wasm-browser:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # The test client and fixture server are standalone crates with their
          # own lockfiles and target dirs; without this they share a cache key
          # with the root crate and thrash it.
          workspaces: |
            .
            wasm-tests/client
            wasm-tests/server

      # Pinned rather than `latest` so an upstream release cannot break CI on a
      # commit that changed nothing. This is the version the suite was
      # developed against.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Build the scripted test server
        run: cargo build --release --manifest-path wasm-tests/server/Cargo.toml

      - name: Start the scripted test server
        run: |
          nohup ./wasm-tests/server/target/release/repe-wasm-test-server \
            > "$RUNNER_TEMP/wasm-test-server.log" 2>&1 &
          # Poll the listener instead of sleeping a fixed amount: a sleep long
          # enough to be safe is wasted on every green run, and a short one
          # flakes.
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8791) 2>/dev/null; then
              cat "$RUNNER_TEMP/wasm-test-server.log"
              exit 0
            fi
            sleep 1
          done
          echo "the test server never started listening on 8791" >&2
          cat "$RUNNER_TEMP/wasm-test-server.log" >&2
          exit 1

      # ubuntu-latest ships Chrome; wasm-pack fetches a matching chromedriver.
      - name: Browser tests (headless Chrome)
        run: wasm-pack test --headless --chrome
        working-directory: wasm-tests/client

      - name: Test server log
        if: failure()
        run: cat "$RUNNER_TEMP/wasm-test-server.log"

  nightly:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

# Explicit rather than implicit. Without a `[workspace]` table the two sibling
# crates are path dependencies and nothing more, so `--workspace` resolves to
# this package alone and `repe-core`'s own tests — the ones that prove the trait
# is usable with `repe` out of the graph — never run in CI.
[workspace]
members = ["repe-core", "repe-derive"]
# Deliberately outside it, and now that the table is explicit it has to say so:
# the shootout pulls in tonic/prost and is built on its own. The two
# `wasm-tests` crates carry their own `[workspace]` tables and need no entry.
exclude = ["bench/grpc-shootout"]

[package]
name = "repe"
version = "13.0.0"
edition = "2024"
rust-version = "1.96.1"
description = "Rust implementation of the REPE RPC protocol (JSON-focused)"
license = "MIT"
repository = "https://github.com/repe-org/repe-rs"
documentation = "https://repe-org.github.io/repe-rs/"
readme = "README.md"
keywords = ["rpc", "protocol", "repe", "json"]
categories = ["network-programming", "encoding"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/docs/**",
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/benches/**",
]

[package.metadata.docs.rs]
# Build docs.rs with every feature so intra-doc links into optional,
# feature-gated modules (e.g. the `websocket`-gated WebSocketServer)
# resolve instead of dangling under the empty default feature set.
all-features = true

[features]
default = []
parking-lot = ["dep:parking_lot"]
fleet-udp = ["dep:uniudp"]
websocket = ["dep:futures-util", "dep:tokio-tungstenite", "dep:tokio-util"]
websocket-wasm = [
    "dep:futures-channel",
    "dep:futures-util",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
cli = ["websocket", "dep:clap", "dep:clap_complete"]
# C-ABI plugin surface: expose a `Router` as a `cdylib` a REPE host `dlopen`s,
# against the same ABI Glaze's `glaze/rpc/repe/plugin.h` defines. Pure `std`, no
# new dependencies. The `extern "C"` exports are emitted into the *plugin's*
# crate by `#[repe::plugin]`, not carried here; what this gates is the ABI
# surface — the layouts and the version constant pinned to that header, which
# move when Glaze's header moves. A crate that is not building a plugin should
# not be held to that. Off on wasm32, where the module is `not(wasm32)` in
# lib.rs: there is no dynamic loader for it to be loaded by.
plugin = []
# The other side of that ABI: `dlopen` a plugin and drive it. Pulls in
# `libloading` for the loader, which is why it is not folded into `plugin` — a
# crate *building* a plugin should not acquire a loader it will never call.
# Enables `plugin` because the host is built on the same layouts and the same
# version constant. Off on wasm32 for the same reason `plugin` is: no loader.
plugin-host = ["plugin", "dep:libloading", "dep:libc"]
# REST facade over a `Registry`: an HTTP/1.1 + HTTP/2 gateway that maps HTTP
# verbs onto the registry's read / write / call trichotomy, so public clients get
# curl, OpenAPI, and edge caching while REPE clients keep the binary fast path.
# Pulls in hyper for the HTTP layer, because a public-facing gateway is the last
# place to hand-roll header and framing parsing. Target-gated like the deps
# below: the module is `not(wasm32)` in lib.rs, since there is no listener to
# bind there.
rest = ["dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# Streaming transfer of a serialized, optionally zstd-compressed in-memory value
# over ordinary REPE request/response (the SVS wire contract). Pulls in
# `zstandard` for the compressed path; the engine itself is plain `std` threads
# + channels.
#
# Resolves to nothing on wasm32: the module is `not(wasm32)` in lib.rs and the
# `zstandard` dep is target-gated to match, so enabling this feature there
# compiles away instead of failing. That is what lets a workspace hoist it into a
# shared feature union alongside a wasm32 member, which cannot subtract it.
value-stream = ["dep:zstandard"]

[[bin]]
name = "repe"
path = "src/bin/repe.rs"
required-features = ["cli"]

[[example]]
name = "websocket_graceful_server"
required-features = ["websocket"]

[[example]]
name = "websocket_cohosting"
required-features = ["websocket"]

# Built as a real shared library, so the generated exports are checked by the
# linker rather than only by rustc: `cargo build --features plugin --example
# repe_plugin` produces a `.so`/`.dylib` a REPE host can `dlopen`.
[[example]]
name = "repe_plugin"
crate-type = ["cdylib"]
required-features = ["plugin"]

# The mirror of `repe_plugin`: a host rather than a plugin. Takes a library path
# on argv, so one binary drives a Rust plugin or a C++ Glaze one — which is what
# the interop job uses it for.
[[example]]
name = "plugin_host"
required-features = ["plugin-host"]

[[example]]
name = "rest_gateway"
required-features = ["rest"]

[[example]]
name = "value_stream"
required-features = ["value-stream"]

[[example]]
name = "writer_stream_digest"
required-features = ["value-stream"]

[[example]]
name = "stream_pull_vs_push"
required-features = ["value-stream"]

[dependencies]
# JSON and BEVE from one struct declaration, with no dependencies of its own
# and no intermediate `Value`. It replaces `serde`, `serde_json` and `beve`
# together, because the three were never separable here: the bulk numeric paths
# are BEVE, the ordinary ones are serde-bound, and the registry that joined them
# was a `serde_json::Value` tree.
#
# What repe uses beyond ordinary read/write: `beve_size` and `to_beve_writer`
# for zero-buffer framing (measure, write the length, stream the body);
# `beve_size_aligned_after` with `beve::Writer::appending(..).aligned().at(..)`
# for a typed array padded against its offset *within the frame* rather than
# within the send buffer; `beve_slice_ref` for the zero-copy borrow behind
# `Router::with_typed_slice_ref`; `read_beve_array_into` for the bulk decode;
# and `minify` / `prettify` for the CLI, which reformats a body it has no type
# for.
structio = "0.2.2"
thiserror = "1"
# Moves in lockstep with this crate: the generated code names items that only
# exist alongside a matching release. 0.6 -> 0.7 is what keeps a `repe = "12"`
# graph from resolving a derive that emits structio paths its `repe` has no
# module for.
repe-derive = { path = "repe-derive", version = "0.7.0" }
# The `RepeStruct` surface, split out so a crate that only *declares* a served
# type — a pure-logic crate with a no-I/O charter, say — can implement the trait
# without acquiring the server, the client, and the transport. Re-exported here
# at the paths it has always had, so nothing moved for a caller of `repe`.
#
# It has no features any more. `typed` existed to keep `beve` and its six
# transitive packages out of a crate that only declares a served type; structio
# has no dependencies, so there is nothing left to gate.
repe-core = { path = "repe-core", version = "4.0.0" }
parking_lot = { version = "0.12", optional = true }
# 0.3.32 for `UnboundedReceiver::try_recv`, which the `notify_slot` tests use
# (`try_next` is deprecated there, and CI builds tests at `-D warnings`).
futures-channel = { version = "0.3.32", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
clap_complete = { version = "4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.24", optional = true }
# `CancellationToken` (in `tokio_util::sync`, gated behind the `rt`
# feature) backs the off-reader handler cancellation signal threaded
# onto `CallContext` and the server-level graceful drain. Pulled in
# only with the `websocket` feature.
tokio-util = { version = "0.7", optional = true, default-features = false, features = ["rt"] }
# Same target-gating rationale as `zstd` below: `uniudp_fleet` is already
# `not(wasm32)` in lib.rs, and uniudp is a std UDP socket stack that refuses
# wasm32-unknown-unknown outright. 1.2.2 dropped mio (whose "This wasm target is
# unsupported by mio" was the old refusal) but still pulls `getrandom`, which
# errors on wasm32-unknown-unknown unless the consumer enables its `wasm_js`
# backend feature.
uniudp = { version = "1.2.2", optional = true }
# Streaming Zstandard codec for the `value-stream` feature (SVS `compression = 1`).
# Optional so the core crate carries no compressor unless the feature is on.
#
# `zstandard` is a pure-Rust implementation of the format: no `cc`, no build
# script, no C toolchain, so it builds for every target Cargo does. It replaces
# the `zstd` C bindings, whose `zstd-sys` build script could not target
# wasm32-unknown-unknown at all (clang: "No available targets are compatible with
# triple wasm32-unknown-unknown", compiling `huf_decompress_amd64.S`).
#
# Still target-gated, now only to match the `not(wasm32)` gate `value_stream`
# carries in lib.rs: that module is std threads + blocking channels, so on wasm32
# there is no consumer for the dep and no reason to build one. Keeping the two
# gates aligned is what lets `value-stream` sit in a *workspace* feature union
# alongside a wasm32 member, since Cargo features are additive and an inheriting
# crate cannot subtract one.
zstandard = { version = "0.1", optional = true }

# The `plugin-host` feature's dynamic loader. Target-gated because there is no
# dynamic loader on wasm32-unknown-unknown, matching the `not(wasm32)` gate the
# `plugin` module already carries in lib.rs.
#
# Preferred over hand-declaring `dlopen`/`dlsym`, which would work on Unix and
# only on Unix: `libloading` carries the Windows `LoadLibraryW` path, the
# thread-safety caveats around `dlerror`, and the platform quirks in symbol
# lookup that a host would otherwise rediscover one platform at a time.
libloading = { version = "0.8", optional = true }

# The `rest` feature's HTTP layer. `hyper` with `http1` + `http2` so the gateway
# serves both over one listener via hyper-util's auto builder: HTTP/2 for clients
# that negotiate it (prior knowledge on cleartext, ALPN behind a TLS terminator),
# HTTP/1.1 for curl and for the origin leg behind a CDN.
hyper = { version = "1", optional = true, default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["server-auto", "tokio"] }
http-body-util = { version = "0.1", optional = true }

# `RTLD_NOLOAD`, for the `plugin-host` resident probe behind
# `Plugin::is_first_handle`. libloading deliberately exposes only the `dlopen`
# flags POSIX specifies, and this one is an extension each platform spells with
# a different value — precisely the per-target table libc maintains and this
# crate should not. Unix-only: the Windows half of the probe is
# `GetModuleHandleExW`, which libloading does expose, so nothing there needs
# this. Declared `optional` and reached through `plugin-host`'s `dep:libc`,
# which resolves to nothing off Unix.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "MessageEvent",
    "Window",
    "WebSocket",
] }

[dev-dependencies]
rand = "0.8"
benchit = "0.1"
# Only for the `value-stream` integration tests: independently decompress a
# pulled `.beve.zst` file to assert its contents. Deliberately the reference C
# implementation rather than the `zstandard` crate the runtime path uses, so the
# assertion is cross-implementation interop rather than self-consistency. A
# dev-dependency does not propagate, so this costs downstream (and wasm32)
# consumers nothing.
zstd = "0.13"

[[bench]]
# Wire-serialization throughput: `Message::to_vec` vs the new
# `Message::into_wire_bytes` for the WebSocket-style outbound path, sized to
# cover both small responses and multi-MiB streaming bodies.
name = "wire_serialization"
harness = false

[[bench]]
# Router dispatch throughput: registered HashMap routes, `Registry`-backed
# routes, and `RepeStruct`-backed routes, each measured with and without a
# middleware pipeline so the hoisted middleware wrap is visible.
name = "route_dispatch"
harness = false

[[bench]]
# End-to-end server request lifecycle (read -> route -> dispatch -> echo ->
# write) over an in-memory transport, for JSON and typed handlers. Pairs with
# `tests/allocations.rs`, which pins the allocation count of the same cycle.
name = "server_lifecycle"
harness = false

# Profiles are read only from the workspace root, so these settings cover
# `repe-core` and `repe-derive` too; the excluded `bench/grpc-shootout` and the
# `wasm-tests` crates are their own workspace roots and keep Cargo's defaults.
[profile.dev]
# Line tables are what a backtrace and a panic location need. Full debuginfo
# additionally describes every type and local for a debugger, and it is the bulk
# of the bytes rustc writes and the linker then chews through — paid on every
# rebuild, whether or not anyone attaches a debugger. Set `debug = true` locally
# for a session that actually needs variable inspection.
debug = "line-tables-only"
# Off deliberately. Incremental trades a slower first build and a large
# `target/incremental` for cheaper edit-rebuild cycles, and it partitions
# codegen units in a way that costs runtime speed in the same `dev` profile the
# test suite runs under. CI already builds non-incrementally (Swatinem/rust-cache
# sets `CARGO_INCREMENTAL=0`), so this is what makes local builds match it.
incremental = false
